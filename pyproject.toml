[project]
name = "aws-python-etl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "boto3",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest", "pytest-cov", "moto[all]", "pyspark",
  "ruff", "mypy", "pre-commit", "bandit", "pip-audit",
]
infra = ["aws-cdk-lib", "constructs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src"

[tool.mypy]
ignore_missing_imports = true
